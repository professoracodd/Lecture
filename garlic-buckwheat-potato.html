<div class="wrap">

  <linearGradient id="subsoil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a7652"/><stop offset="1" stop-color="#b08d66"/></linearGradient>
  <radialGradient id="acidGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe14d" stop-opacity="0.65"/><stop offset="1" stop-color="#ffe14d" stop-opacity="0"/></radialGradient>

</defs>
<rect width="1536" height="1152" fill="url(#sky)"/>
<g id="soilG"></g><g id="grainG"></g><g id="acidG"></g><g id="rootsG"></g><g id="resG"></g><g id="micG"></g><g id="azoG"></g><g id="hyphG"></g><g id="potG"></g><g id="garlicG"></g><g id="coverG"></g><g id="compG"></g><g id="tokG"></g><g id="labelG"></g><g id="uiG"></g><g id="tlG"></g>

<nav class="bar" aria-label="Step controls">
  <button id="restart" class="icon" aria-label="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  <button id="back" aria-label="Previous step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Back</span></button>

  <button id="fs" class="icon" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

<script>
(async function(){
try{await Promise.race([Promise.all(['500 28px Inter','600 24px Inter','700 28px Inter','800 54px Inter'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
const NS='http://www.w3.org/2000/svg';
const W=1536,H=1152,G=470,TOP=700,BOT=1030;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function $(id){return document.getElementById(id);}
let seed=21;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ss=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const eback=x=>{x=clamp(x,0,1);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerp=(a,b,u)=>a+(b-a)*u;
function bz(p,t){const u=1-t;return [u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]];}
function bzd(p,t){const u=1-t;return [3*u*u*(p[1][0]-p[0][0])+6*u*t*(p[2][0]-p[1][0])+3*t*t*(p[3][0]-p[2][0]),3*u*u*(p[1][1]-p[0][1])+6*u*t*(p[2][1]-p[1][1])+3*t*t*(p[3][1]-p[2][1])];}
function nrm(p,t){const d=bzd(p,t);const L=Math.hypot(d[0],d[1])||1;return [-d[1]/L,d[0]/L];}
function taper(p,w0,w1,n=40){const L=[],R=[];for(let i=0;i<=n;i++){const t=i/n,q=bz(p,t),m=nrm(p,t),w=(w0+(w1-w0)*Math.pow(t,0.8))/2;
  L.push([q[0]+m[0]*w,q[1]+m[1]*w]);R.push([q[0]-m[0]*w,q[1]-m[1]*w]);}
  let d='M'+L.map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join('L');
  d+=`A${(w1/2).toFixed(1)},${(w1/2).toFixed(1)} 0 0 1 `+R[R.length-1][0].toFixed(1)+','+R[R.length-1][1].toFixed(1);
  d+='L'+R.reverse().map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join('L')+'Z';return d;}

// ---------- soil profile ----------
(function(){const g=$('soilG');
  el('rect',{x:0,y:G,width:W,height:TOP-G,fill:'url(#topsoil)'},g);
  el('rect',{x:0,y:TOP,width:W,height:BOT-TOP,fill:'url(#subsoil)'},g);
  let d=`M0,${TOP}`;for(let x=0;x<=W;x+=24)d+=`L${x},${TOP+Math.sin(x/37)*6+(rnd()-0.5)*6}`;d+=`L${W},${TOP+30}L0,${TOP+30}Z`;
  el('path',{d,fill:'#8f6a45',opacity:0.35},g);
  for(let i=0;i<520;i++){const x=rnd()*W,y=G+10+rnd()*(TOP-G-10),r=3+rnd()*11;const dark=rnd()<0.6;
    el('ellipse',{cx:x,cy:y,rx:r,ry:r*(0.55+rnd()*0.4),transform:`rotate(${rnd()*180} ${x} ${y})`,fill:dark?`rgba(25,15,8,${0.12+rnd()*0.18})`:`rgba(150,105,70,${0.08+rnd()*0.12})`},g);}
  for(let i=0;i<300;i++){const x=rnd()*W,y=TOP+12+rnd()*(BOT-TOP-14),r=3+rnd()*10;
    el('ellipse',{cx:x,cy:y,rx:r,ry:r*0.7,transform:`rotate(${rnd()*180} ${x} ${y})`,fill:rnd()<0.5?`rgba(80,55,30,${0.10+rnd()*0.15})`:`rgba(220,190,150,${0.10+rnd()*0.15})`},g);}
  el('rect',{x:0,y:G-6,width:W,height:12,fill:'#6b8f3a'},g);
  el('rect',{x:0,y:G+4,width:W,height:4,fill:'rgba(0,0,0,0.2)'},g);
  el('rect',{x:0,y:BOT,width:W,height:H-BOT,fill:'#fff'},g);
})();
// bound-P mineral grains in subsoil
const GRAINS=[];
(function(){const g=$('grainG');
  const xs=[150,330,520,700,860,1040,1220,1400];
  xs.forEach((x0,i)=>{for(let k=0;k<2;k++){const x=x0+(rnd()-0.5)*90,y=TOP+60+rnd()*(BOT-TOP-110),r=18+rnd()*12;
    let pts=[];for(let j=0;j<8;j++){const a=j/8*Math.PI*2,rr=r*(0.8+rnd()*0.35);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr*0.8]);}
    el('polygon',{points:pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' '),fill:'#bdb09a',stroke:'#7d6f5c','stroke-width':2},g);
    GRAINS.push({x,y,r});}});
})();

// ---------- plants ----------
const GX=[150,330,520,700,880,1060,1240,1420];
const garlic=[];
(function(){const g=$('garlicG');
  GX.forEach((x,i)=>{const gg=el('g',{},g);
    // roots (shallow fibrous)
    for(let k=0;k<7;k++){const a=(k/6-0.5)*1.9,l=50+rnd()*40;el('path',{d:`M${x},${G+30} q${Math.sin(a)*l*0.4},${l*0.5} ${Math.sin(a)*l*0.8},${l}`,stroke:'#efe2c4','stroke-width':2.5,fill:'none'},gg);}
    el('ellipse',{cx:x,cy:G+18,rx:20,ry:17,fill:'#f7f1e6',stroke:'#c9b79a','stroke-width':2},gg);
    el('path',{d:`M${x-12},${G+16} q12,-10 24,0`,stroke:'#d8c9b0','stroke-width':1.5,fill:'none'},gg);
    const top=el('g',{},gg);
    for(let k=0;k<5;k++){const lean=(k-2)*9+(rnd()-0.5)*6,h=110+rnd()*50;
      el('path',{d:`M${x+(k-2)*2},${G+4} Q${x+lean*0.6},${G-h*0.6} ${x+lean*1.6},${G-h}`,stroke:k%2?'#6aa84f':'#5a9a40','stroke-width':7,fill:'none','stroke-linecap':'round'},top);}
    garlic.push({g:gg,top,x,y:G+18});});
})();
// buckwheat (x positions 150,520,880,1240) and cowpea (330,700,1060,1420)
const BX=[150,520,880,1240], CX=[330,700,1060,1420];
const BROOTS=[];
const buck=[],cow=[];
(function(){
  const rootsG=$('rootsG'),g=$('coverG');
  BX.forEach((x,i)=>{
    const tap=[[x,G],[x+8,620],[x-10,820],[x+6,980]];
    const lat1=[[x+2,600],[x+40,620],[x+80,660],[x+105,720]],lat2=[[x-2,700],[x-40,720],[x-70,770],[x-90,830]];
    const rg=el('g',{},rootsG);
    [ [lat1,8,2],[lat2,7,2],[tap,16,3] ].forEach(([p,w0,w1])=>el('path',{d:taper(p,w0,w1),fill:'#f0e1c2',stroke:'#b99a6a','stroke-width':1.6},rg));
    const brown=el('g',{opacity:0},rootsG);
    [ [lat1,8,2],[lat2,7,2],[tap,16,3] ].forEach(([p,w0,w1])=>el('path',{d:taper(p,w0,w1),fill:'#6e4a2b',stroke:'#4a3019','stroke-width':1.6,'stroke-dasharray':'6 5'},brown));
    BROOTS.push({x,tap,rg,brown});
    const sg=el('g',{},g);
    el('path',{d:taper([[x,G+4],[x-4,420],[x+6,330],[x,250]],11,5),fill:'#b5523f',stroke:'#8a3a2c','stroke-width':1.2},sg);
    const leaf=(lx,ly,ang,s)=>{const gg=el('g',{transform:`translate(${lx},${ly}) rotate(${ang}) scale(${s})`},sg);
      el('path',{d:'M0,0 L22,0',stroke:'#7a8f3a','stroke-width':4},gg);
      el('path',{d:'M22,0 C26,-26 46,-34 58,-30 C64,-28 70,-22 92,0 C70,22 64,28 58,30 C46,34 26,26 22,0Z',fill:'#6aab48',stroke:'#4a8a2d','stroke-width':2},gg);};
    leaf(x-3,440,-160,0.8);leaf(x+2,405,-22,0.85);leaf(x-2,365,-150,0.8);leaf(x+3,320,-30,0.75);leaf(x-2,290,-140,0.7);
    for(let k=0;k<12;k++){const a=rnd()*Math.PI*2,r=rnd()*18,fx=x+Math.cos(a)*r,fy=242+Math.sin(a)*r*1.2;
      el('circle',{cx:fx,cy:fy,r:5,fill:'#fdf6f8',stroke:'#e2b3c1','stroke-width':1},sg);}
    buck.push({g:sg,x});
  });
  CX.forEach((x,i)=>{
    const rg=el('g',{},rootsG);
    const p1=[[x,G],[x+4,560],[x-4,640],[x+2,720]],p2=[[x,520],[x+30,540],[x+60,580],[x+70,630]],p3=[[x,560],[x-30,580],[x-55,620],[x-60,670]];
    [[p2,6,2],[p3,6,2],[p1,12,3]].forEach(([p,w0,w1])=>el('path',{d:taper(p,w0,w1),fill:'#f0e1c2',stroke:'#b99a6a','stroke-width':1.5},rg));
    const nods=[];[[p2,0.4],[p2,0.75],[p3,0.5],[p1,0.45],[p1,0.7]].forEach(([p,t],k)=>{const q=bz(p,t);nods.push(el('circle',{cx:q[0]+(k%2?6:-6),cy:q[1],r:7,fill:'#e7a08a',stroke:'#8f5444','stroke-width':1.5},rg));});
    const brown=el('g',{opacity:0},rootsG);
    [[p2,6,2],[p3,6,2],[p1,12,3]].forEach(([p,w0,w1])=>el('path',{d:taper(p,w0,w1),fill:'#6e4a2b',stroke:'#4a3019','stroke-width':1.5,'stroke-dasharray':'6 5'},brown));
    const sg=el('g',{},g);
    el('path',{d:`M${x},${G+4} Q${x-6},${G-60} ${x},${G-120}`,stroke:'#4f8a2c','stroke-width':7,fill:'none','stroke-linecap':'round'},sg);
    const tri=(lx,ly,ang)=>{const gg=el('g',{transform:`translate(${lx},${ly}) rotate(${ang})`},sg);
      el('path',{d:'M0,0 L18,0',stroke:'#4f8a2c','stroke-width':3},gg);
      [[-40,30],[40,30],[0,36]].forEach(([a,l])=>{const g2=el('g',{transform:`translate(18,0) rotate(${a})`},gg);
        el('path',{d:`M0,0 C${l*0.3},-12 ${l*0.8},-11 ${l},0 C${l*0.8},11 ${l*0.3},12 0,0Z`,fill:'#5fa53e',stroke:'#3f7d25','stroke-width':1.6},g2);});};
    tri(x,G-20,-150);tri(x,G-30,-30);tri(x,G-70,-160);tri(x,G-80,-20);tri(x,G-115,-90);
    cow.push({g:sg,rg,brown,nods,x});
  });
})();
// residue fragments (after incorporation)
const RES=[];
(function(){const g=$('resG');
  for(let i=0;i<46;i++){const x=40+rnd()*(W-80),y=G+16+rnd()*120,l=14+rnd()*22,a=rnd()*180;
    const r=el('rect',{x:x-l/2,y:y-3.5,width:l,height:7,rx:3.5,fill:rnd()<0.5?'#7d6a2e':'#5d6b2a',transform:`rotate(${a} ${x} ${y})`,opacity:0},g);
    RES.push({x,y,el:r});}
})();
// microbes
const MIC=[];
(function(){const g=$('micG');
  for(let i=0;i<70;i++){const r=RES[i%RES.length];const x=r.x+(rnd()-0.5)*50,y=clamp(r.y+(rnd()-0.5)*40,G+12,TOP-10);MIC.push({x,y});}
  BROOTS.forEach(b=>{for(let k=0;k<9;k++){const q=bz(b.tap,0.25+k*0.085);MIC.push({x:q[0]+(rnd()-0.5)*26,y:q[1]});}});
  MIC.forEach((m,i)=>{m.g=el('g',{transform:`translate(${m.x},${m.y}) scale(0)`},g);m.s=1.5;m.d=rnd()*0.8;
    if(i%3==0){el('ellipse',{rx:6,ry:4,fill:'#2aa08b',stroke:'#0f5a4c','stroke-width':1.2,transform:`rotate(${rnd()*180})`},m.g);}
    else if(i%3==1){el('circle',{r:4,fill:'#4bb3a0',stroke:'#0f5a4c','stroke-width':1.2},m.g);}
    else{el('path',{d:'M-7,0 q3,-5 7,0 q4,5 7,0',stroke:'#e2c26a','stroke-width':2.4,fill:'none'},m.g);}});
})();
// potatoes
const PX=[260,600,940];const pot=[];
(function(){const g=$('potG'),hg=$('hyphG');
  PX.forEach((x,i)=>{
    const rg=el('g',{},g);
    for(let k=0;k<8;k++){const a=(k/7-0.5)*2.2,l=70+rnd()*50;el('path',{d:`M${x},${G+20} q${Math.sin(a)*l*0.5},${l*0.5} ${Math.sin(a)*l},${l}`,stroke:'#efe2c4','stroke-width':2.5,fill:'none'},rg);}
    const tubers=[];[[-60,62,1],[50,78,0.9],[-15,98,1.1],[75,46,0.7]].forEach(([dx,dy,s])=>{
      el('path',{d:`M${x},${G+24} Q${x+dx*0.4},${G+dy*0.6} ${x+dx},${G+dy}`,stroke:'#e8d9b5','stroke-width':3,fill:'none'},rg);
      const t=el('g',{transform:`translate(${x+dx},${G+dy}) scale(0)`},rg);
      el('ellipse',{rx:26*s,ry:19*s,fill:'#c99a63',stroke:'#8c6436','stroke-width':2},t);
      el('circle',{cx:-6*s,cy:-4*s,r:2,fill:'#8c6436'},t);el('circle',{cx:8*s,cy:5*s,r:2,fill:'#8c6436'},t);
      tubers.push({g:t,x:x+dx,y:G+dy});});
    const sg=el('g',{},g);
    const stems=[[-30,-150],[0,-175],[32,-145]];
    stems.forEach(([dx,h])=>el('path',{d:`M${x},${G+4} Q${x+dx*0.4},${G+h*0.5} ${x+dx},${G+h}`,stroke:'#4f8a2c','stroke-width':7,fill:'none','stroke-linecap':'round'},sg));
    const lf=(lx,ly,a,s)=>{const gg=el('g',{transform:`translate(${lx},${ly}) rotate(${a}) scale(${s})`},sg);
      el('path',{d:'M0,0 L60,0',stroke:'#4f8a2c','stroke-width':3},gg);
      [[14,-1],[14,1],[30,-1],[30,1],[46,-1],[46,1]].forEach(([px,side])=>el('ellipse',{cx:px,cy:side*9,rx:10,ry:6,fill:'#5c9e3a',stroke:'#3f7d25','stroke-width':1.2},gg));
      el('ellipse',{cx:64,cy:0,rx:12,ry:8,fill:'#5c9e3a',stroke:'#3f7d25','stroke-width':1.2},gg);};
    [[-30,-150,-150],[-25,-110,-170],[0,-175,-95],[32,-145,-30],[28,-100,-10],[-12,-70,-160],[14,-60,-20]].forEach(([dx,dy,a])=>lf(x+dx,G+dy,a,0.9));

const DUR=[0,3.0,4.0,4.6,3.2,4.0,5.0,3.6];
window.render=function(t){

 'Buckwheat roots release acid exudates that free bound phosphorus deep in the subsoil. The plant takes it up and moves it into its leaves and stems. Meanwhile Azotobacter on the buckwheat roots and the cowpea nodules fix nitrogen from the air into living cells.',
 'About 40 days after sowing, in June, the buckwheat and cowpea are incorporated. The residue and its phosphorus land in the topsoil, and the roots decay in place all the way down.',
 'Through the summer, decomposition drives a bloom of microbes in the topsoil and along the old root channels. The phosphorus and the fixed nitrogen move into microbial biomass.',
 'In August, whole seed potatoes are planted and inoculated with mycorrhizal fungi. The soil food web cycles phosphorus out of the microbes, the fungi reach it, and the nitrogen and phosphorus feed the tubers.',
 'Compost is added to replace the phosphorus removed by the garlic and potato harvests. Summary: harvests remove P, buckwheat lifts deep P, cowpea and Azotobacter add nitrogen, microbes store and cycle nitrogen and phosphorus, and compost adds P back.'];
const STEPS=CAPS.map((c,i)=>({s:T[i],e:T[i]+DUR[i],desc:DESC[i]}));
let cur=0,raf=null;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const dotsEl=$('dots');
const dots=STEPS.map((st,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Step '+(i+1)+': '+CAPS[i]);b.onclick=()=>go(i,false);dotsEl.appendChild(b);return b;});
function ui(){dots.forEach((d,i)=>{if(i===cur)d.setAttribute('aria-current','step');else d.removeAttribute('aria-current');});
  $('back').disabled=cur===0;$('next').disabled=cur===STEPS.length-1;
  $('svgDesc').textContent=STEPS[cur].desc;$('live').textContent='Step '+(cur+1)+' of '+STEPS.length+'. '+STEPS[cur].desc;}
function stop(){if(raf){cancelAnimationFrame(raf);raf=null;}}
function go(i,animate){stop();i=clamp(i,0,STEPS.length-1);cur=i;ui();const st=STEPS[i];
  if(!animate||reduce||st.e<=st.s){render(st.e);return;}
  render(st.s);const t0=performance.now();
  const tick=now=>{const t=st.s+(now-t0)/1000;if(t>=st.e){render(st.e);raf=null;return;}render(t);raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);}
$('next').onclick=()=>go(cur+1,true);$('back').onclick=()=>go(cur-1,false);$('restart').onclick=()=>go(0,false);
$('fs').onclick=()=>{const d=document.documentElement;if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();if(cur<STEPS.length-1)go(cur+1,true);}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1,false);}
  else if(e.key==='Home'){go(0,false);}});
go(0,false);
})();

</script>
