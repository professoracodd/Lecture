<style>
  :root{
    --bg:#f6f3ea; --ink:#1f2d24; --muted:#5b6b60; --green:#2f7d4f; --leaf:#4a9a5e;
    --red:#b8392b; --redbg:#fbe1dc; --pa:#2b6cb0; --pab:#dbe8f6; --pb:#b7800f; --pbb:#f6e8c6;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1f2d24;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:960px;height:540px;background:var(--bg);position:relative;transform-origin:center center;border-radius:6px;overflow:hidden}
  header{position:absolute;left:0;right:0;top:0;height:72px;padding:14px 28px 0}
  .tag{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
  h1{margin:2px 0 0;font-size:27px;line-height:1.15}
  svg#art{position:absolute;left:0;top:72px;width:960px;height:378px}
  footer{position:absolute;left:0;right:0;bottom:0;height:90px;padding:12px 28px;display:flex;align-items:center;gap:20px;border-top:1px solid #e1dccd;background:#fbf9f3}
  #cap{flex:1;margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 26px;font-size:19px}
  #cap li{position:relative;padding-left:16px}
  #cap li::before{content:"";position:absolute;left:0;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--green)}
  nav{display:flex;align-items:center;gap:8px}
  nav button{font:inherit;font-size:15px;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:var(--green);color:#fff;display:flex;align-items:center;gap:6px}
  nav button.sec{background:#e4dfd0;color:var(--ink)}
  nav button:disabled{opacity:.35;cursor:default}
  nav button:focus-visible{outline:3px solid var(--pb);outline-offset:2px}
  #dots{display:flex;gap:5px;margin:0 6px}
  #dots span{width:8px;height:8px;border-radius:50%;background:#cfc9b8}
  #dots span.cur{background:var(--green)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  /* reveal animation */
  .r{opacity:0}
  .on .r{animation:rin .7s ease forwards;animation-delay:var(--d,0s)}
  @keyframes rin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .on .grow{transform-box:fill-box;transform-origin:50% 100%;animation:rin .7s ease forwards,grow 1.4s ease forwards;animation-delay:var(--d,0s),var(--d,0s)}
  @keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
  .on .pulse{animation:rin .5s ease forwards,pulse 1.6s ease-in-out infinite;animation-delay:var(--d,0s),calc(var(--d,0s) + .5s)}
  @keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
  .on .sweep{animation:rin .5s ease forwards,sweep 5s ease-in-out infinite;animation-delay:var(--d,0s),var(--d,0s)}
  @keyframes sweep{0%,100%{transform:translateX(0)}50%{transform:translateX(560px)}}
  svg text{font-family:inherit;fill:var(--ink)}
  .lbl{font-size:17px;font-weight:600}
  .sm{font-size:14px;fill:var(--muted)}
  .al{font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:central}
  .ctr{text-anchor:middle}
  body.auto nav{display:none}
  @media (prefers-reduced-motion:reduce){
    .on .r,.on .grow,.on .pulse,.on .sweep{animation:none;opacity:1;transform:none}
  }
  body.rm .on .r,body.rm .on .grow,body.rm .on .pulse,body.rm .on .sweep{animation:none;opacity:1;transform:none}
</style>
</head>
<body>
<div id="wrap">
  <main id="stage" aria-roledescription="slideshow">
    <header>
      <div class="tag" id="tag"></div>
      <h1 id="title"></h1>
    </header>
    <svg id="art" viewBox="0 0 960 378" role="img" aria-labelledby="artdesc"><desc id="artdesc"></desc><g id="scene"></g></svg>
    <footer>
      <ul id="cap"></ul>
      <nav aria-label="Step controls">
        <button class="sec" id="prev" aria-label="Previous step"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
        <div id="dots" aria-hidden="true"></div>
        <button id="next" aria-label="Next step">Next<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </nav>
    </footer>
    <div class="sr" id="live" aria-live="polite"></div>
  </main>
</div>
<script>
/* ---------- drawing helpers ---------- */
const C={pa:'#2b6cb0',pab:'#dbe8f6',pb:'#b7800f',pbb:'#f6e8c6',red:'#b8392b',redbg:'#fbe1dc',green:'#2f7d4f',leaf:'#4a9a5e',ink:'#1f2d24',muted:'#5b6b60'};
const d=s=>`style="--d:${s}s"`;

function plant(x,base,s,pot,opts={}){
  const h=150*s, dash=opts.dash, stroke=dash?C.muted:'#2d6b3f';
  const fill=dash?'none':C.leaf, sd=dash?'stroke-dasharray="6 5"':'';
  let g=`<g class="${opts.cls||'grow'}" ${d(opts.d||0)}>`;
  g+=`<path d="M${x} ${base} C ${x-6*s} ${base-h*.45}, ${x+6*s} ${base-h*.7}, ${x} ${base-h}" stroke="${stroke}" stroke-width="${dash?2:4*s+1}" fill="none" ${sd}/>`;
  for(let i=0;i<4;i++){
    const y=base-h*(.22+.2*i), rx=(30-i*4)*s, ry=11*s;
    g+=`<ellipse cx="${x-rx*.9}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-24 ${x-rx*.9} ${y})" fill="${fill}" stroke="${dash?C.muted:'#2d6b3f'}" stroke-width="1.5" ${sd}/>`;
    g+=`<ellipse cx="${x+rx*.9}" cy="${y-8*s}" rx="${rx}" ry="${ry}" transform="rotate(24 ${x+rx*.9} ${y-8*s})" fill="${fill}" stroke="${dash?C.muted:'#2d6b3f'}" stroke-width="1.5" ${sd}/>`;
  }
  g+=`<ellipse cx="${x}" cy="${base-h-6*s}" rx="${9*s}" ry="${16*s}" fill="${fill}" stroke="${dash?C.muted:'#2d6b3f'}" stroke-width="1.5" ${sd}/>`;
  g+='</g>';
  if(pot) g+=`<path d="M${x-30} ${base} h60 l-7 38 h-46 z" fill="${pot}" ${opts.potCls?`class="${opts.potCls}" ${d(opts.d||0)}`:''}/>`;
  return g;
}
/* one chromosome with two loci; alleles: [{t,bad}] top->bottom; src color pair */
function chrom(x,y,al,src,h=210){
  const [col,bg]=src==='A'?[C.pa,C.pab]:[C.pb,C.pbb];
  let g=`<rect x="${x}" y="${y}" width="40" height="${h}" rx="20" fill="${bg}" stroke="${col}" stroke-width="2.5"/>`;
  al.forEach((a,i)=>{
    const by=y+h*(i===0?.27:.73);
    g+=`<rect x="${x-4}" y="${by-19}" width="48" height="38" rx="6" fill="${a.bad?C.redbg:'#fff'}" stroke="${a.bad?C.red:col}" stroke-width="2"/>`;
    g+=`<text class="al" x="${x+20}" y="${by}" style="fill:${a.bad?C.red:C.ink}">${a.t}</text>`;
  });
  return g;
}
function arrow(x1,y1,x2,y2,col=C.ink,w=3){
  const ang=Math.atan2(y2-y1,x2-x1),L=12;
  const ax=x2-L*Math.cos(ang-0.45),ay=y2-L*Math.sin(ang-0.45),bx=x2-L*Math.cos(ang+0.45),by=y2-L*Math.sin(ang+0.45);
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M${ax} ${ay} L${x2} ${y2} L${bx} ${by}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
const cross=(x,y)=>`<g stroke="${C.ink}" stroke-width="4" stroke-linecap="round"><line x1="${x-11}" y1="${y-11}" x2="${x+11}" y2="${y+11}"/><line x1="${x+11}" y1="${y-11}" x2="${x-11}" y2="${y+11}"/></g>`;
const G=(a)=>({t:a,bad:false}), B=(a)=>({t:a,bad:true});
function maskPill(x,y,dl){
  return `<g class="r" ${d(dl)}><rect x="${x-6}" y="${y-22}" width="52" height="44" rx="8" fill="#ffffff" fill-opacity=".86" stroke="${C.green}" stroke-width="2.5"/><text x="${x+20}" y="${y+1}" class="ctr" style="font-size:12px;font-weight:700;fill:${C.green};dominant-baseline:central">masked</text></g>`;
}
function iconHead(x,y,type){ /* small drawn icons for summary cards */
  if(type==='shield') return `<path d="M${x} ${y-22} l20 7 v12 c0 14-9 22-20 27 c-11-5-20-13-20-27 v-12 z" fill="${C.green}"/><path d="M${x-8} ${y+2} l6 6 l11-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(type==='bars') return `<rect x="${x-22}" y="${y-2}" width="11" height="20" fill="${C.muted}"/><rect x="${x-5}" y="${y+6}" width="11" height="12" fill="${C.muted}"/><rect x="${x+12}" y="${y-20}" width="11" height="38" fill="${C.green}"/>`;
  return `<circle cx="${x-16}" cy="${y-10}" r="7" fill="${C.pa}"/><circle cx="${x-16}" cy="${y+12}" r="7" fill="${C.pa}"/><circle cx="${x+16}" cy="${y-10}" r="7" fill="${C.pb}"/><circle cx="${x+16}" cy="${y+12}" r="7" fill="${C.pb}"/><g stroke="${C.green}" stroke-width="2.5"><line x1="${x-9}" y1="${y-10}" x2="${x+9}" y2="${y+12}"/><line x1="${x-9}" y1="${y+12}" x2="${x+9}" y2="${y-10}"/><line x1="${x-9}" y1="${y-10}" x2="${x+9}" y2="${y-10}"/></g>`;
}

/* ---------- steps ---------- */
const steps=[
{tag:'Heterosis', title:'Why can’t hybrid vigor be fully explained?',
 cap:['F1 hybrid outperforms both parents','3 hypotheses','Each explains part'],
 desc:'Two small inbred parent plants are crossed to make a much larger F1 hybrid plant.',
 last:3.5,
 svg:()=>`
  <text class="lbl ctr r" x="150" y="40" ${d(0)}>Inbred Parent A</text>
  ${plant(150,280,.85,C.pa,{d:.2})}
  <g class="r" ${d(1)}>${cross(285,200)}</g>
  <text class="lbl ctr r" x="420" y="40" ${d(1.2)}>Inbred Parent B</text>
  ${plant(420,280,.8,C.pb,{d:1.4})}
  <g class="r" ${d(2.4)}>${arrow(530,200,620,200,C.ink,4)}</g>
  <text class="lbl ctr r" x="770" y="30" ${d(2.6)} style="fill:${C.green}">F1 Hybrid</text>
  ${plant(770,280,1.38,C.green,{d:2.8})}
  <text class="sm ctr r" x="770" y="358" ${d(3.5)}>bigger, faster, higher yield</text>`},

{tag:'Hypothesis 1 · Dominance', title:'Complementary masking',
 cap:['Inbreds: homozygous harmful recessives','Other parent’s dominant allele masks them'],
 desc:'Parent A carries A A at gene 1 and harmful b b at gene 2. Parent B carries harmful a a at gene 1 and B B at gene 2. The F1 is A a and b B, so each harmful recessive is masked by a dominant allele.',
 last:4.6,
 svg:()=>`
  <text class="sm r" x="18" y="${70+210*.27+5}" ${d(0)}>Gene 1</text>
  <text class="sm r" x="18" y="${70+210*.73+5}" ${d(0)}>Gene 2</text>
  <g class="r" ${d(.2)}><text class="lbl ctr" x="168" y="45">Parent A</text>${chrom(120,70,[G('A'),B('b')],'A')}${chrom(176,70,[G('A'),B('b')],'A')}</g>
  <g class="r" ${d(.9)}><path d="M234 211 h10 v56 h-10" stroke="${C.red}" stroke-width="2.5" fill="none"/><text x="252" y="234" style="font-size:13px;fill:${C.red};font-weight:700">harmful</text><text x="252" y="250" style="font-size:13px;fill:${C.red};font-weight:700">recessive</text></g>
  <g class="r" ${d(1.4)}>${cross(345,175)}</g>
  <g class="r" ${d(1.6)}><text class="lbl ctr" x="458" y="45">Parent B</text>${chrom(410,70,[B('a'),G('B')],'B')}${chrom(466,70,[B('a'),G('B')],'B')}</g>
  <g class="r" ${d(2.3)}><path d="M398 96 h-10 v56 h10" stroke="${C.red}" stroke-width="2.5" fill="none"/><text x="382" y="119" style="font-size:13px;fill:${C.red};font-weight:700;text-anchor:end">harmful</text><text x="382" y="135" style="font-size:13px;fill:${C.red};font-weight:700;text-anchor:end">recessive</text></g>
  <g class="r" ${d(3)}>${arrow(545,175,640,175,C.ink,4)}</g>
  <g class="r" ${d(3.3)}><text class="lbl ctr" x="728" y="45" style="fill:${C.green}">F1 Hybrid</text>${chrom(680,70,[G('A'),B('b')],'A')}${chrom(736,70,[B('a'),G('B')],'B')}</g>
  ${maskPill(736,70+210*.27,4.1)}${maskPill(680,70+210*.73,4.4)}
  <text class="sm r" x="800" y="${70+210*.27+5}" ${d(4.1)}>A covers a</text>
  <text class="sm r" x="800" y="${70+210*.73+5}" ${d(4.4)}>B covers b</text>`},

{tag:'Hypothesis 1 · Why it’s incomplete', title:'Then a pure-breeding line should match the hybrid',
 cap:['Prediction: recombine to AABB','Reality: vigor not recovered (most cases)'],
 desc:'If dominance were the whole story, breeders could recombine and inbreed to a pure-breeding A A B B line as vigorous as the hybrid. In most cases the pure line falls short.',
 last:4.6,
 svg:()=>`
  <text class="lbl ctr r" x="140" y="30" ${d(0)} style="fill:${C.green}">F1 Hybrid (Aa Bb)</text>
  ${plant(140,280,1.4,C.green,{d:.2})}
  <g class="r" ${d(1.2)}>${arrow(255,190,365,190,C.ink,4)}<text class="sm ctr" x="310" y="170">recombine</text><text class="sm ctr" x="310" y="215">+ inbreed</text></g>
  <g class="r" ${d(1.6)}><text class="lbl ctr" x="458" y="30">Pure-breeding AABB</text>
    <g transform="translate(0,-10) scale(1)">${chrom(410,60,[G('A'),G('B')],'A',190)}${chrom(466,60,[G('A'),G('B')],'B',190)}</g></g>
  <g class="r" ${d(2.6)}><text class="lbl ctr" x="690" y="30" style="fill:${C.muted}">Predicted</text></g>
  ${plant(690,280,1.4,null,{dash:true,cls:'r',d:2.6})}
  <path d="M660 280 h60 l-7 38 h-46 z" fill="none" stroke="${C.muted}" stroke-width="2" stroke-dasharray="6 5" class="r" ${d(2.6)}/>
  <g class="r" ${d(3.4)}><text class="lbl ctr" x="860" y="30">Actual</text></g>
  ${plant(860,280,.95,'#7a8a7e',{d:3.4})}
  <g class="r" ${d(4.4)}><rect x="560" y="330" width="390" height="40" rx="8" fill="${C.redbg}" stroke="${C.red}" stroke-width="2"/><text x="755" y="356" class="ctr" style="font-size:19px;font-weight:700;fill:${C.red}">In most cases, breeders cannot.</text></g>`},

{tag:'Hypothesis 2 · Overdominance', title:'Heterozygote advantage',
 cap:['Aa beats AA and aa','Two different alleles outperform two copies'],
 desc:'Bar chart of function or protein output at one gene: A A and a a are moderate; the heterozygote A a is highest.',
 last:3.6,
 svg:()=>{
  const base=310,x0=180;
  const bar=(i,h,lab,col,dl,sub)=>`<rect class="grow" ${d(dl)} x="${x0+i*170}" y="${base-h}" width="110" height="${h}" rx="4" fill="${col}"/><text class="ctr r" ${d(dl)} x="${x0+i*170+55}" y="${base+30}" style="font-size:24px;font-weight:700">${lab}</text><text class="sm ctr r" ${d(dl)} x="${x0+i*170+55}" y="${base+52}">${sub}</text>`;
  return `<g class="r" ${d(0)}><line x1="150" y1="${base}" x2="700" y2="${base}" stroke="${C.ink}" stroke-width="2"/><line x1="150" y1="${base}" x2="150" y2="40" stroke="${C.ink}" stroke-width="2"/><text class="sm" transform="translate(130 ${base-40}) rotate(-90)">Function / protein output</text></g>
  ${bar(0,140,'AA',C.pa,.5,'homozygous')}${bar(1,120,'aa',C.pb,1.3,'homozygous')}${bar(2,245,'Aa',C.green,2.2,'heterozygous')}
  <g class="r" ${d(3.6)}>${arrow(760,135,645,120,C.green,3)}<text x="768" y="131" style="font-size:16px;font-weight:700;fill:${C.green}">superior</text><text x="768" y="151" style="font-size:16px;font-weight:700;fill:${C.green}">at this locus</text></g>`;}},

{tag:'Hypothesis 2 · Why it’s incomplete', title:'Finding the “super-allele” is very hard',
 cap:['Must isolate single super-alleles','Complex genomes hide them'],
 desc:'A long chromosome with dozens of gene loci; a magnifying glass sweeps back and forth searching for the one overdominant locus.',
 last:2.5,
 svg:()=>{
  let ticks='';for(let i=0;i<64;i++){const x=120+i*11.3;ticks+=`<rect x="${x}" y="150" width="4" height="60" fill="${i%7===3?'#9fb7a6':'#c9c2ae'}"/>`;}
  return `<g class="r" ${d(0)}><rect x="100" y="140" width="760" height="80" rx="40" fill="${C.pab}" stroke="${C.pa}" stroke-width="2.5"/>${ticks}<text class="sm ctr" x="480" y="250">thousands of loci across the genome</text></g>
  <g class="sweep" ${d(1)}><circle cx="150" cy="180" r="48" fill="#fff" fill-opacity=".35" stroke="${C.ink}" stroke-width="6"/><line x1="184" y1="214" x2="220" y2="250" stroke="${C.ink}" stroke-width="12" stroke-linecap="round"/><text class="ctr" x="150" y="194" style="font-size:40px;font-weight:800;fill:${C.red}">?</text></g>
  <g class="r" ${d(2.5)}><text class="lbl ctr" x="480" y="70">Which locus? Which allele pair?</text><text class="sm ctr" x="480" y="98">Proving overdominance means isolating single genes, one at a time</text></g>
  <g class="r" ${d(2.5)}><rect x="285" y="300" width="390" height="40" rx="8" fill="${C.redbg}" stroke="${C.red}" stroke-width="2"/><text x="480" y="326" class="ctr" style="font-size:18px;font-weight:700;fill:${C.red}">Exceptionally difficult to prove</text></g>`;}},

{tag:'Hypothesis 3 · Epistasis', title:'Gene-to-gene networks',
 cap:['Many genes interact','Two backgrounds combine synergistically'],
 desc:'Six genes from Parent A and six from Parent B form a network; links between them light up and feed a boost in metabolism and growth.',
 last:3.4,
 svg:()=>{
  const A=[[170,70],[120,150],[170,230],[260,300],[290,110],[300,200]], Bn=[[560,70],[610,150],[560,230],[470,300],[440,110],[430,200]];
  const links=[[0,4],[1,5],[2,3],[4,5],[0,0],[1,1],[5,5],[3,2],[4,4],[2,3],[5,1]];
  let L='';links.forEach(([a,b],i)=>{const p=A[a],q=Bn[b];L+=`<line class="pulse" ${d(1.4+i*.15)} x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${C.green}" stroke-width="3"/>`;});
  let N='';A.forEach((p,i)=>N+=`<circle class="r" ${d(.2+i*.08)} cx="${p[0]}" cy="${p[1]}" r="17" fill="${C.pa}"/>`);
  Bn.forEach((p,i)=>N+=`<circle class="r" ${d(.8+i*.08)} cx="${p[0]}" cy="${p[1]}" r="17" fill="${C.pb}"/>`);
  return `<text class="lbl ctr r" x="200" y="30" ${d(.2)} style="fill:${C.pa}">Genes from Parent A</text>
  <text class="lbl ctr r" x="530" y="30" ${d(.8)} style="fill:${C.pb}">Genes from Parent B</text>
  ${L}${N}
  <g class="r" ${d(3.2)}>${arrow(650,190,740,190,C.green,5)}</g>
  <g class="r" ${d(3.4)}><rect x="750" y="130" width="190" height="120" rx="12" fill="${C.green}"/><text x="845" y="178" class="ctr" style="font-size:19px;font-weight:700;fill:#fff">Supercharged</text><text x="845" y="204" class="ctr" style="font-size:16px;fill:#fff">metabolism</text><text x="845" y="226" class="ctr" style="font-size:16px;fill:#fff">& growth</text></g>`;}},

{tag:'Hypothesis 3 · Why it’s incomplete', title:'Too many interactions to map',
 cap:['Possible gene pairs explode','Can’t test them all'],
 desc:'Possible pairwise gene interactions: 10 genes give 45 pairs, 100 genes give 4,950 pairs, and 30,000 genes give about 450 million pairs, before counting three-way interactions.',
 last:3.6,
 svg:()=>{
  const rows=[['10 genes','45',.3,40],['100 genes','4,950',1.3,130],['30,000 genes','≈ 450 million',2.3,520]];
  let s=`<text class="sm r" x="80" y="40" ${d(0)}>Possible gene-pair interactions</text>`;
  rows.forEach(([g,n,dl,w],i)=>{const y=80+i*85;
    s+=`<text class="lbl r" x="80" y="${y+30}" ${d(dl)}>${g}</text><rect class="r" ${d(dl)} x="250" y="${y+6}" width="${w}" height="40" rx="6" fill="${i===2?C.red:C.green}"/><text class="r" ${d(dl+.3)} x="${262+w}" y="${y+33}" style="font-size:22px;font-weight:700">${n}</text>`;});
  s+=`<g class="r" ${d(3.6)}><text class="sm" x="80" y="350">…and that is only pairs, before three-way and larger interactions</text></g>`;
  return s;}},

{tag:'Summary', title:'Each hypothesis explains part — none explains all',
 cap:['Dominance','Overdominance','Epistasis','Still not fully solved'],
 desc:'Three cards: dominance, overdominance, and epistasis, each with its gap. Heterosis is still not fully explained.',
 last:2.4,
 svg:()=>{
  const cards=[['shield','Dominance','Masks harmful recessives','Gap: pure lines fall short'],['bars','Overdominance','Aa beats AA and aa','Gap: super-alleles hard to isolate'],['net','Epistasis','Gene networks interact','Gap: too many to map']];
  let s='';cards.forEach(([ic,t,a,b],i)=>{const x=40+i*300,dl=.2+i*.6;
    s+=`<g class="r" ${d(dl)}><rect x="${x}" y="20" width="280" height="240" rx="14" fill="#fff" stroke="#ddd6c4" stroke-width="2"/>${iconHead(x+140,72,ic)}<text class="ctr" x="${x+140}" y="140" style="font-size:22px;font-weight:700">${t}</text><text class="ctr" x="${x+140}" y="176" style="font-size:16px">${a}</text><text class="ctr" x="${x+140}" y="222" style="font-size:15px;font-weight:600;fill:${C.red}">${b}</text></g>`;});
  s+=`<g class="r" ${d(2.4)}><text class="ctr" x="480" y="320" style="font-size:22px;font-weight:700;fill:${C.green}">Hybrid vigor is likely a mix of all three — and still not fully explained.</text></g>`;
  return s;}}
];

/* ---------- player ---------- */
const params=new URLSearchParams(location.search);
const AUTO=params.has('autoplay'), PAUSE=8000;
if(AUTO) document.body.classList.add('auto');
if(params.has('rm')) document.body.classList.add('rm');
let i=0,timer=null;
const $=id=>document.getElementById(id);
const dots=$('dots'); steps.forEach(()=>dots.appendChild(document.createElement('span')));
function show(n){
  i=Math.max(0,Math.min(steps.length-1,n));
  const s=steps[i];
  $('tag').textContent=`Step ${i+1} of ${steps.length} · ${s.tag}`;
  $('title').textContent=s.title;
  $('cap').innerHTML=s.cap.map(c=>`<li>${c}</li>`).join('');
  $('artdesc').textContent=s.desc;
  const art=$('art'); art.classList.remove('on');
  $('scene').innerHTML=s.svg();
  void art.getBoundingClientRect(); art.classList.add('on');
  [...dots.children].forEach((e,k)=>e.classList.toggle('cur',k===i));
  $('prev').disabled=i===0; $('next').disabled=i===steps.length-1;
  $('live').textContent=`Step ${i+1}: ${s.title}. ${s.desc}`;
  if(AUTO){clearTimeout(timer);timer=setTimeout(()=>show(i===steps.length-1?0:i+1),(s.last+1)*1000+PAUSE);}
}
$('prev').onclick=()=>show(i-1);
$('next').onclick=()=>show(i+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(i+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(i-1);}
  if(e.key==='Home')show(0); if(e.key==='End')show(steps.length-1);
});
function fit(){const k=Math.min(innerWidth/960,innerHeight/540);$('stage').style.transform=`scale(${k})`;}
addEventListener('resize',fit); fit();
const st=parseInt(params.get('step'));
show(isNaN(st)?0:st-1);
</script>
