<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fertigation cycle</title>

<meta property="og:title" content="Fertigation cycle">
<meta property="og:type" content="website">
<meta property="og:url" content="https://professoracodd.github.io/Lecture/fertigation.html">
<meta property="og:image" content="https://professoracodd.github.io/Lecture/fertigation-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Fertigation cycle">
<meta name="twitter:image" content="https://professoracodd.github.io/Lecture/fertigation-preview.png">
<meta name="twitter:player" content="https://professoracodd.github.io/Lecture/fertigation.html">
<meta name="twitter:player:width" content="800">
<meta name="twitter:player:height" content="600">

<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d0d7de;--card:#f6f8fa;--accent:#0b66c3;--accent-bg:#e6f1fb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fff;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:4px 10px 8px;gap:4px}
#scene{flex:1 1 0;min-height:0;width:100%;display:block}
.th,.ts{font-family:inherit}
.th{font-size:14px;font-weight:500;fill:var(--fg)}
.ts{font-size:12px;fill:var(--muted)}
.leader{stroke:var(--muted);stroke-width:.5;stroke-dasharray:3 3}
.arr{stroke:var(--muted);stroke-width:1.5;fill:none}

.flow,.spray{fill:none;stroke-linecap:round;transition:opacity .4s}
#flowB{transition:stroke 2.5s,opacity .4s}
.spray{transition:stroke 2.5s,opacity .4s}
#inj{transition:opacity .6s}
#liquid{transition:transform 3s}
#scene.off .flow,#scene.off .spray{opacity:0}
#scene.off .spin{animation-play-state:paused}
@media (prefers-reduced-motion:no-preference){
.flow{stroke-dasharray:10 8;animation:fl .7s linear infinite}
.spray{stroke-dasharray:4 6;animation:spr .6s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:rot 1s linear infinite}}
@keyframes fl{to{stroke-dashoffset:-18}}
@keyframes spr{to{stroke-dashoffset:-10}}
@keyframes rot{to{transform:rotate(360deg)}}

.info{flex:none;min-height:38px}
.ttl{font-weight:500;font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.35}

button{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);cursor:pointer}
button:hover{background:var(--card)}
button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps{flex:none;display:flex;gap:5px}
.seg{position:relative;overflow:hidden;min-width:70px;justify-content:flex-start;font-size:12.5px;padding:4px 9px}
.seg[data-i="0"]{flex:135 1 0}
.seg[data-i="1"]{flex:30 1 0}
.seg[data-i="2"]{flex:15 1 0}
.seg.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.pg{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent)}
.row{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="app">
<svg id="scene" class="off" viewBox="0 0 680 395" role="img" aria-labelledby="st sd" style="--spc:#3aa0f0">
<title id="st">Fertigation system</title>
<desc id="sd">A pump pushes water down a pipe to emitters at the base of trees. A fertilizer tank connects to the pipe through a valve that opens only during the injection step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect id="liquid" x="33" y="103" width="104" height="144" rx="12" fill="#8cc63f" fill-opacity=".75" style="transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.75)"/>
<rect x="30" y="100" width="110" height="150" rx="14" fill="#2f7fd6" fill-opacity=".14" stroke="#1f5fae" stroke-width="2"/>
<path d="M33 140H137M33 175H137M33 210H137" stroke="#1f5fae" stroke-opacity=".35" fill="none"/>
<path d="M58 100Q58 84 85 84Q112 84 112 100Z" fill="#2f7fd6" fill-opacity=".25" stroke="#1f5fae" stroke-width="2"/>
<text class="th" x="85" y="72" text-anchor="middle">Fertilizer tank</text>

<path d="M140 220H240" fill="none" stroke="#1f5fae" stroke-opacity=".45" stroke-width="14"/>
<path d="M140 220H240" fill="none" stroke="#7db8f0" stroke-opacity=".3" stroke-width="9"/>
<path d="M270 70H240V330H660" fill="none" stroke="#1f5fae" stroke-opacity=".45" stroke-width="24"/>
<path d="M270 70H240V330H660" fill="none" stroke="#7db8f0" stroke-opacity=".3" stroke-width="18"/>

<path class="flow" d="M270 70H240V330" stroke="#3aa0f0" stroke-width="6"/>
<path id="flowB" class="flow" d="M240 330H660" stroke-width="6" style="stroke:#3aa0f0"/>
<path id="inj" class="flow" d="M140 220H240" stroke="#8cc63f" stroke-width="5" opacity="0"/>

<path d="M172 208L200 232V208L172 232Z" fill="#9aa0a8" stroke="#5d636c" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M186 220V198" stroke="#5d636c" stroke-width="3" fill="none"/>
<rect id="vh" x="176" y="192" width="20" height="6" rx="2" fill="#d9534f"/>
<text class="ts" x="186" y="256" text-anchor="middle">Valve</text>

<rect x="270" y="48" width="76" height="44" rx="8" fill="#1f9e94"/>
<rect x="322" y="56" width="24" height="28" rx="4" fill="#17776f"/>
<rect x="296" y="40" width="16" height="9" rx="2" fill="#e8772e"/>
<circle cx="298" cy="70" r="15" fill="#17776f"/>
<g class="spin"><path d="M298 58V82M286 70H310" stroke="#d8f3ef" stroke-width="3" fill="none" stroke-linecap="round"/></g>
<text class="th" x="308" y="30" text-anchor="middle">Water pump</text>
<line class="arr" x1="396" y1="70" x2="352" y2="70" marker-end="url(#arrow)"/>
<text class="ts" x="402" y="74">Water in</text>

<path d="M387 318L391 250H399L403 318Z" fill="#5b4636"/>
<ellipse cx="395" cy="212" rx="40" ry="34" fill="#4f8a3a"/><ellipse cx="373" cy="232" rx="26" ry="22" fill="#5d9a45"/><ellipse cx="418" cy="230" rx="26" ry="22" fill="#447a31"/>
<path d="M537 318L541 250H549L553 318Z" fill="#5b4636"/>
<ellipse cx="545" cy="212" rx="40" ry="34" fill="#4f8a3a"/><ellipse cx="523" cy="232" rx="26" ry="22" fill="#5d9a45"/><ellipse cx="568" cy="230" rx="26" ry="22" fill="#447a31"/>

<rect x="316" y="308" width="8" height="12" fill="#8a8f98"/><rect x="314" y="303" width="12" height="5" rx="1" fill="#5d636c"/>
<rect x="466" y="308" width="8" height="12" fill="#8a8f98"/><rect x="464" y="303" width="12" height="5" rx="1" fill="#5d636c"/>
<rect x="616" y="308" width="8" height="12" fill="#8a8f98"/><rect x="614" y="303" width="12" height="5" rx="1" fill="#5d636c"/>
<g stroke-width="2.5" style="stroke:var(--spc)">
<path class="spray" d="M320 302Q290 238 268 306"/><path class="spray" d="M320 302Q306 252 294 308"/><path class="spray" d="M320 302Q334 252 346 308"/><path class="spray" d="M320 302Q350 238 372 306"/>
<path class="spray" d="M470 302Q440 238 418 306"/><path class="spray" d="M470 302Q456 252 444 308"/><path class="spray" d="M470 302Q484 252 496 308"/><path class="spray" d="M470 302Q500 238 522 306"/>
<path class="spray" d="M620 302Q590 238 568 306"/><path class="spray" d="M620 302Q606 252 594 308"/><path class="spray" d="M620 302Q634 252 646 308"/><path class="spray" d="M620 302Q650 238 672 306"/>
</g>
<line class="leader" x1="470" y1="346" x2="470" y2="360"/>
<text class="ts" x="470" y="376" text-anchor="middle">Emitters</text>
</svg>

<div class="info">
<div id="ttl" class="ttl"></div>
<div id="note" class="note"></div>
</div>

<div class="steps">
<button class="seg" type="button" data-i="0">1 · 135 min<span class="pg"></span></button>
<button class="seg" type="button" data-i="1">2 · 30 min<span class="pg"></span></button>
<button class="seg" type="button" data-i="2">3 · 15 min<span class="pg"></span></button>
</div>

<div class="row">
<button id="power" type="button"></button>
<button id="back" type="button"></button>
<button id="play" type="button"></button>
<button id="next" type="button"></button>
</div>
</main>

<script>
var IC={
 power:'<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',
 play:'<path d="M7 5l12 7-12 7z"/>',
 pause:'<path d="M8 5v14M16 5v14"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',
 right:'<path d="M9 5l7 7-7 7"/>'
};
function icon(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}

var HOLD=8000;
var S=[
{name:'Clean water irrigation',dur:'2 h 15 min',valve:false,col:'#3aa0f0',inj:0,level:.75,note:'Valve closed. Only pump water runs through the line, wetting the root zone and charging the system.'},
{name:'Fertigation injection',dur:'30 min',valve:true,col:'#8cc63f',inj:1,level:.6,note:'Valve open. Fertilizer from the tank enters the line and travels to every emitter with the irrigation water.'},
{name:'Fresh water flush',dur:'15 min',valve:false,col:'#3aa0f0',inj:0,level:.6,note:'Valve closed. Clean water pushes leftover fertilizer out of the pipe and emitters so nothing sits in the line.'}
];
var i=0,t=0,playing=false,on=false;
var $=function(id){return document.getElementById(id)};
var segs=document.querySelectorAll('.seg');

function paint(){
 segs.forEach(function(b,k){b.querySelector('.pg').style.width=(k===i?Math.min(100,t/HOLD*100):0)+'%'});
}
function playLabel(){
 $('play').innerHTML=playing?icon('pause')+' Pause':icon('play')+' Play';
}
function apply(){
 var s=S[i];
 $('scene').style.setProperty('--spc',s.col);
 $('flowB').style.stroke=s.col;
 $('inj').setAttribute('opacity',s.inj);
 $('vh').setAttribute('fill',s.valve?'#3fa34d':'#d9534f');
 $('liquid').style.transform='scaleY('+s.level+')';
 $('ttl').textContent='Step '+(i+1)+' of 3: '+s.name+' ('+s.dur+')';
 $('note').textContent=on?s.note:'Sprinklers are off. Turn them on to see this step run.';
 segs.forEach(function(b,k){b.classList.toggle('on',k===i)});
 paint();
}
function setOn(v){
 on=v;
 $('scene').classList.toggle('off',!v);
 $('power').innerHTML=icon('power')+(v?' Turn off sprinklers':' Turn on sprinklers');
 if(!v){playing=false;playLabel()}
 apply();
}
function go(n){i=(n+3)%3;t=0;apply()}

$('back').innerHTML=icon('left')+' Back';
$('next').innerHTML='Next '+icon('right');
playLabel();

$('power').onclick=function(){setOn(!on)};
$('back').onclick=function(){go(i-1)};
$('next').onclick=function(){go(i+1)};
segs.forEach(function(b){b.onclick=function(){go(+b.dataset.i)}});
$('play').onclick=function(){
 if(!on)setOn(true);
 playing=!playing;
 playLabel();
};

setInterval(function(){
 if(!playing||!on)return;
 t+=100;
 if(t>=HOLD){i=(i+1)%3;t=0;apply()}else{paint()}
},100);

setOn(false);
</script>
</body>
</html>
